<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff1493" />
      <stop offset="100%" style="stop-color:#ff69b4" />
    </linearGradient>
  </defs>
  
  <!-- Hintergrund -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Blütenblätter -->
  <ellipse cx="50" cy="30" rx="8" ry="14" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="50" cy="30" rx="8" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(60 50 50)"/>
  <ellipse cx="50" cy="30" rx="8" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(120 50 50)"/>
  <ellipse cx="50" cy="30" rx="8" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(180 50 50)"/>
  <ellipse cx="50" cy="30" rx="8" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(240 50 50)"/>
  <ellipse cx="50" cy="30" rx="8" ry="14" fill="#ffffff" opacity="0.9" transform="rotate(300 50 50)"/>
  
  <!-- Blütenmitte -->
  <circle cx="50" cy="50" r="10" fill="#ffd700"/>
  <circle cx="50" cy="50" r="5" fill="#ffffff" opacity="0.5"/>
  
  <!-- Glitzer -->
  <circle cx="20" cy="20" r="2" fill="#ffd700" opacity="0.8"/>
  <circle cx="80" cy="25" r="1.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="25" cy="80" r="1.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="75" cy="75" r="2" fill="#ffd700" opacity="0.5"/>
</svg>
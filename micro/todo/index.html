<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo – Meine ToDo-Liste</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a855f7'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%2312101c'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='10' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='3.5' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-orbs">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="app">

    <header class="header">
      <h1>
        <span class="gradient-text">Todo</span>
      </h1>
      <p class="subtitle">Was ist heute dein Fokus?</p>
    </header>

    <!-- FOKUS BEREICH -->
    <section id="focus-card" class="focus-card empty-focus">
      <div class="focus-label">⭐ HAUPTFOKUS</div>
      <p id="focus-text" class="focus-text">Kein Fokus gesetzt – markiere ein ToDo mit ⭐</p>
    </section>

    <!-- EINGABE -->
    <form id="add-form" class="add-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Neues ToDo eingeben..."
        autocomplete="off"
        required
      />
      <button type="submit" class="btn-add" aria-label="Hinzufügen">+</button>
    </form>

    <!-- LISTE -->
    <section class="list-section">
      <div class="list-header">
        <span id="count">0 Aufgaben</span>
        <button id="clear-done" class="btn-clear" title="Erledigte entfernen">Erledigte löschen</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-msg" class="empty-msg">Noch keine ToDos. Füge dein erstes hinzu! ✨</p>
    </section>

  </main>

  <script src="src/main.js"></script>
</body>
</html>

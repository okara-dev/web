<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo – Meine ToDo-Liste</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ccff00'/%3E%3Cstop offset='1' stop-color='%23ff00a0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0a0a'/%3E%3Cpath d='M20 32 L28 40 L44 24' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

  <!-- Neue, subtile Hintergrund-Effekte -->
  <div class="bg-grid"></div>
  <div class="bg-glow glow-lime"></div>
  <div class="bg-glow glow-pink"></div>

  <main class="app">

    <header class="header">
      <div class="status-badge">
        <span class="status-dot"></span> System Online
      </div>
      <h1>
        <span class="neon-text">Todo</span><span class="accent-text">.</span>
      </h1>
      <p class="subtitle">Was ist heute dein Fokus?</p>
    </header>

    <!-- FOKUS BEREICH -->
    <section id="focus-card" class="focus-card empty-focus">
      <div class="focus-label">⭐ HAUPTFOKUS</div>
      <p id="focus-text" class="focus-text">Kein Fokus gesetzt – markiere ein ToDo mit ⭐</p>
    </section>

    <!-- EINGABE -->
    <form id="add-form" class="add-form">
      <input
        type="text"
        id="todo-input"
        placeholder="Neues ToDo eingeben..."
        autocomplete="off"
        required
      />
      <button type="submit" class="btn-add" aria-label="Hinzufügen">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </form>

    <!-- LISTE -->
    <section class="list-section">
      <div class="list-header">
        <span id="count" class="count-badge">0 Aufgaben</span>
        <button id="clear-done" class="btn-clear" title="Erledigte entfernen">Clear Done</button>
      </div>
      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-msg" class="empty-msg">Noch keine ToDos. Füge dein erstes hinzu! ✨</p>
    </section>

  </main>

  <script src="src/main.js"></script>
</body>
</html>

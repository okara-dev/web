<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="64" height="64" rx="16" fill="#0b1220"/>

  <!-- Aurora-Glow im Hintergrund -->
  <circle cx="32" cy="32" r="28" fill="url(#glow)"/>

  <!-- Äußerer Ring (dezent) -->
  <circle cx="32" cy="32" r="26"
          fill="none" stroke="url(#aurora)" stroke-width="1.5" opacity="0.3"/>

  <!-- Das "D" als Hauptelement -->
  <path d="M22 18 L22 46 M22 18 L34 18 C44 18, 50 24, 50 32 C50 40, 44 46, 34 46 L22 46"
        fill="none"
        stroke="url(#aurora)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Glowender Termin-Punkt -->
  <circle cx="42" cy="32" r="4" fill="url(#aurora)"/>
  <circle cx="42" cy="32" r="7" fill="none" stroke="url(#aurora)" stroke-width="1.5" opacity="0.5"/>
</svg>
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cake – Vergiss nie wieder einen Geburtstag. Mit Kalender-Ansicht und personalisiertem Geburtstagsseiten-Generator.">
    <meta name="author" content="Onur Kara">
    <title>Cake – Geburtstage nie vergessen</title>
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg">
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="header-inner">
            <div class="logo">
                <svg viewBox="0 0 64 64" width="36" height="36">
                    <defs>
                        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#f472b6"/>
                            <stop offset="1" stop-color="#a78bfa"/>
                        </linearGradient>
                        <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#fbbf24"/>
                            <stop offset="1" stop-color="#f97316"/>
                        </linearGradient>
                    </defs>
                    <rect x="29" y="18" width="6" height="14" rx="1.5" fill="url(#lg)"/>
                    <path d="M32 10 Q35 14 32 18 Q29 14 32 10 Z" fill="url(#fl)"/>
                    <rect x="14" y="34" width="36" height="6" rx="2" fill="url(#lg)"/>
                    <rect x="18" y="40" width="28" height="10" rx="2" fill="url(#lg)" opacity="0.85"/>
                    <circle cx="24" cy="45" r="1.2" fill="#fff" opacity="0.7"/>
                    <circle cx="32" cy="45" r="1.2" fill="#fff" opacity="0.7"/>
                    <circle cx="40" cy="45" r="1.2" fill="#fff" opacity="0.7"/>
                </svg>
                <h1>Cake</h1>
            </div>
            <p class="tagline">Vergiss nie wieder einen Geburtstag</p>
        </div>
    </header>

    <main class="app">

        <!-- ADD FORM -->
        <section class="card add-card">
            <h2>Neuen Geburtstag hinzufügen</h2>
            <form id="add-form" class="birthday-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Name *</label>
                        <input type="text" id="name" placeholder="z. B. Oma" required maxlength="40">
                    </div>
                    <div class="form-group">
                        <label for="date">Geburtsdatum *</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="group">Gruppe</label>
                        <select id="group">
                            <option value="familie">Familie</option>
                            <option value="freunde">Freunde</option>
                            <option value="arbeit">Arbeit</option>
                            <option value="sonstiges">Sonstiges</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="note">Notiz (optional)</label>
                        <input type="text" id="note" placeholder="z. B. mag Schokolade" maxlength="60">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Hinzufügen</button>
            </form>
        </section>

        <!-- CALENDAR -->
        <section class="card calendar-card">
            <div class="card-header">
                <h2>Kalender <span id="calendar-year" class="calendar-year"></span></h2>
                <div class="legend" id="legend"></div>
            </div>
            <div class="calendar" id="calendar"></div>
        </section>

    </main>

    <!-- GENERATOR MODAL -->
    <div class="modal-overlay" id="generator-modal">
        <div class="modal">
            <button class="modal-close" id="close-modal" aria-label="Schließen">✕</button>
            <h2 class="modal-title">Geburtstagsseite erstellen</h2>
            <p class="modal-subtitle">Für <strong id="modal-person-name">–</strong></p>

            <div class="generator-grid">
                <!-- FORMULAR -->
                <div class="generator-form">
                    <div class="form-group">
                        <label for="gen-message">Persönliche Nachricht *</label>
                        <textarea id="gen-message" rows="4" placeholder="Alles Gute zum Geburtstag! Ich wünsche dir..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="gen-from">Von wem?</label>
                        <input type="text" id="gen-from" placeholder="z. B. Onur" maxlength="30">
                    </div>
                    <div class="form-group">
                        <label for="gen-wishes">Wünsche (eine pro Zeile)</label>
                        <textarea id="gen-wishes" rows="3" placeholder="Gesundheit&#10;Glück&#10;Erfolg"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="gen-gift">Geschenk-Nachricht (was steckt im Geschenk?)</label>
                        <textarea id="gen-gift" rows="2" placeholder="z. B. Ein Gutschein für unser Lieblingsrestaurant!"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="gen-template">Template</label>
                        <select id="gen-template">
                            <option value="confetti">Konfetti</option>
                            <option value="elegant">Elegant</option>
                            <option value="retro">Retro</option>
                        </select>
                    </div>
                    <div class="generator-actions">
                        <button class="btn btn-secondary" id="btn-preview">Vorschau</button>
                        <button class="btn btn-primary" id="btn-download">Download .html</button>
                    </div>
                </div>

                <!-- VORSCHAU -->
                <div class="generator-preview">
                    <div class="preview-label">Vorschau</div>
                    <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <p>© 2026 Cake · Alle Daten bleiben lokal in deinem Browser</p>
    </footer>

    <script src="src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein persönliches Glücksrad</title>
    <link rel="stylesheet" href="src/style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="src/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-section">
                <input type="text" id="titleInput" class="title-input" value="🎡 Glücksrad" maxlength="40">
                <button id="editTitleBtn" class="edit-title-btn">✏️</button>
            </div>
            <p>Füge deine eigenen Werte hinzu und dreh das Rad!</p>
        </header>

        <div class="wheel-container">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
            <button id="spinBtn" class="spin-btn">🎲 DREHEN 🎲</button>
            <button id="sound-toggle" class="sound-btn">🔊 Sound an</button>
            <div id="result" class="result">Klick auf Drehen!</div>
        </div>

        <div class="values-section">
            <h2>📝 Meine Werte</h2>
            <div class="input-group">
                <input type="text" id="valueInput" placeholder="z.B. 10€ Gewinn">
                <button id="addBtn" class="btn-add">➕ Hinzufügen</button>
            </div>
            
            <div id="valuesList" class="values-list"></div>
            
            <div class="button-group">
                <button id="resetBtn" class="btn-reset">🗑️ Alle löschen</button>
                <button id="exampleBtn" class="btn-example">✨ Beispielwerte</button>
            </div>
        </div>
    </div>

    <script src="src/main.js?v=5"></script>
</body>
</html>

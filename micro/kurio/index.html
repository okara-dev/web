<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurio – Live Währungskurse & Umrechner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2310b981'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Cpath d='M20 40 L28 30 L36 36 L46 22' fill='none' stroke='url(%23g)' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M40 22 L46 22 L46 28' fill='none' stroke='url(%23g)' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="app">

    <header class="header">
      <div class="brand">
        <svg viewBox="0 0 64 64" width="32" height="32">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#10b981"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="20" fill="none" stroke="url(#lg)" stroke-width="3"/>
          <path d="M20 40 L28 30 L36 36 L46 22" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M40 22 L46 22 L46 28" fill="none" stroke="url(#lg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Kurio</h1>
      </div>
      <div class="status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">Lade Kurse…</span>
      </div>
    </header>

    <section class="hero">
      <div class="hero-pair">
        <span id="hero-from">EUR</span>
        <span class="arrow">→</span>
        <span id="hero-to">USD</span>
      </div>
      <div class="hero-rate">
        <span id="hero-value">–</span>
      </div>
      <div class="hero-meta">
        <span id="hero-updated">–</span>
        <span id="hero-change" class="change neutral">–</span>
      </div>
    </section>

    <section class="card">
      <h2>💱 Umrechner</h2>
      <div class="converter-grid">
        <div class="field">
          <label for="amount">Betrag</label>
          <input type="number" id="amount" value="1" min="0" step="0.01" />
        </div>
        <div class="field">
          <label for="from-currency">Von</label>
          <select id="from-currency"></select>
        </div>
        <div class="field">
          <label for="to-currency">Nach</label>
          <select id="to-currency"></select>
        </div>
      </div>
      <div class="converter-result">
        <span id="converted-value">–</span>
        <small id="converted-hint">–</small>
      </div>
      <button id="swap-btn" class="btn-swap">⇄ Tauschen</button>
    </section>

    <section class="card">
      <div class="chart-header">
        <h2>📈 Kursverlauf</h2>
        <div class="range-btns">
          <button data-range="7" class="range-btn">7 T</button>
          <button data-range="30" class="range-btn active">30 T</button>
          <button data-range="90" class="range-btn">90 T</button>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="rate-chart"></canvas>
      </div>
      <p class="chart-hint" id="chart-hint">Verlauf wird geladen…</p>
    </section>

    <section class="card">
      <h2>⭐ Beliebte Paare</h2>
      <ul id="popular-list" class="popular-list"></ul>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
